name: backend

services:
  worker:
    build: ./worker
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy 
    networks:
      - back-tier
    profiles:
      - backend

  redis:
    image: redis:8.8.3-alpine@sha256:0b2b77d3ea5078274795e3177cdbdada8b96316684a38911d528534ed679b5ec
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - '6379:6379'
    volumes:
      - "./healthchecks:/healthchecks"
      - redis-data:/data
    command: redis-server --appendonly yes --save 900 1 --save 300 10
    healthcheck:
      test: /healthchecks/redis.sh
      interval: "5s"
    networks:
      - back-tier
    profiles:
      - backend

  volumes:
    redis-data:

  networks:
    back-tier:
